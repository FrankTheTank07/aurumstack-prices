name: Update Metal Prices

concurrency:
  group: update-metal-prices
  cancel-in-progress: true

on:
  workflow_dispatch:

  schedule:
    # Runs at the start of every hour (UTC)
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Verify required tools
        run: |
          jq --version
          curl --version

      - name: Run script
        run: bash scripts/fetch-prices.sh

      - name: Commit JSON
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add data/prices.json data/price-history.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update prices"
            git push
          fi
